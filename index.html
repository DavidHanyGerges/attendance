<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance scanner</title>
<style>
  :root { --bg:#10141a; --fg:#f2f4f7; --muted:#8b95a5; --ok:#3ddc84; --warn:#ffb020; --bad:#ff5c5c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-size: 14px; }
  #count { font-size: 22px; font-weight: 700; }
  #net { color: var(--muted); }
  #net.off { color: var(--warn); }
  #view { position: relative; flex: 0 0 auto; width: 100%; aspect-ratio: 3 / 4; max-height: 55vh; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; }
  #flash { position: absolute; inset: 0; border: 6px solid transparent; pointer-events: none; transition: border-color .15s; }
  #log { flex: 1; overflow-y: auto; padding: 8px 14px; margin: 0; list-style: none; }
  #log li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222a35; font-size: 15px; }
  .logged { color: var(--ok); } .duplicate { color: var(--warn); } .unknown, .error { color: var(--bad); } .queued { color: var(--muted); }
  #start { margin: 24px; padding: 16px; font-size: 18px; border: 0; border-radius: 8px; background: var(--ok); color: #05210f; font-weight: 700; }
  #msg { padding: 0 14px 10px; color: var(--bad); font-size: 14px; min-height: 18px; }
</style>
</head>
<body>
<header>
  <div><span id="count">0</span> scanned</div>
  <div id="net">online</div>
</header>
<div id="view" hidden><video id="video" playsinline muted></video><div id="flash"></div></div>
<button id="start">Start camera</button>
<div id="msg"></div>
<ul id="log"></ul>

<script>
// ---- CONFIG ----
const ENDPOINT = 'PASTE_APPS_SCRIPT_WEB_APP_URL';
const TOKEN = 'CHANGE_ME_TO_A_LONG_RANDOM_STRING'; // must match Code.gs
// ----------------

const TZ = 'Africa/Cairo';
const today = () => new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date()); // yyyy-mm-dd
const $ = id => document.getElementById(id);

const seenKey = 'seen:' + today();
const queueKey = 'queue';
const seen = new Set(JSON.parse(localStorage.getItem(seenKey) || '[]'));
let queue = JSON.parse(localStorage.getItem(queueKey) || '[]');
let flushing = false;

$('count').textContent = seen.size;

function save() {
  localStorage.setItem(seenKey, JSON.stringify([...seen]));
  localStorage.setItem(queueKey, JSON.stringify(queue));
}

function addLog(id, status) {
  const li = document.createElement('li');
  li.className = status;
  li.innerHTML = '<span></span><span></span>';
  li.children[0].textContent = id;
  li.children[1].textContent = status;
  $('log').prepend(li);
}

function flash(color) {
  $('flash').style.borderColor = color;
  setTimeout(() => $('flash').style.borderColor = 'transparent', 250);
}

async function flush() {
  if (flushing || !queue.length) return;
  flushing = true;
  const batch = queue.slice();
  try {
    const res = await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: TOKEN, scans: batch })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    queue = queue.filter(q => !batch.includes(q));
    data.results.forEach(r => { if (r.status !== 'logged') addLog(r.id, r.status); });
    save();
    $('msg').textContent = '';
  } catch (e) {
    $('msg').textContent = 'Upload failed, will retry: ' + e.message;
  } finally {
    flushing = false;
  }
}

function handle(id) {
  if (seen.has(id)) return;
  seen.add(id);
  queue.push({ id, ts: Date.now() });
  save();
  $('count').textContent = seen.size;
  addLog(id, 'logged');
  flash('#3ddc84');
  if (navigator.vibrate) navigator.vibrate(60);
  flush();
}

async function start() {
  if (!('BarcodeDetector' in window)) {
    $('msg').textContent = 'BarcodeDetector not supported in this browser. Use Chrome on Android.';
    return;
  }
  const detector = new BarcodeDetector({ formats: ['qr_code'] });
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
    });
  } catch (e) {
    $('msg').textContent = 'Camera error: ' + e.message;
    return;
  }
  const video = $('video');
  video.srcObject = stream;
  await video.play();
  $('start').hidden = true;
  $('view').hidden = false;

  let busy = false;
  setInterval(async () => {
    if (busy || video.readyState < 2) return;
    busy = true;
    try {
      const codes = await detector.detect(video);
      codes.forEach(c => { const v = c.rawValue.trim(); if (v) handle(v); });
    } catch (e) { /* frame skipped */ }
    busy = false;
  }, 150);
}

function updateNet() {
  $('net').textContent = navigator.onLine ? 'online' : 'offline';
  $('net').className = navigator.onLine ? '' : 'off';
  if (navigator.onLine) flush();
}
window.addEventListener('online', updateNet);
window.addEventListener('offline', updateNet);
setInterval(flush, 10000);
updateNet();

$('start').addEventListener('click', start);
</script>
</body>
</html>
